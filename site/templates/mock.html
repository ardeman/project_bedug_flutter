<div class="phone" role="img" aria-label="${static_label_attr}" data-label="${label_attr}" data-strings="${strings_attr}">
<div class="screen" aria-hidden="true">
<div class="app-hero">
<img class="app-drum" src="/assets/drum.svg" alt="" width="1024" height="1024">
<div class="app-top"><p class="app-place">${pin_icon}<span>${place}</span></p><span class="app-refresh">${refresh_icon}</span></div>
<p class="app-next">${next_prayer} · <time dir="ltr">${next_time}</time></p>
<p class="app-name">${next_name}</p>
<p class="app-count">${timer_icon}<span dir="ltr">00:14:00</span></p>
</div>
<div class="app-days">
<ol class="app-strip">${strip}</ol>
<p class="app-date"><strong>${date}</strong><span>${hijri}</span></p>
</div>
<ul class="app-list">${rows}</ul>
<ul class="app-tabs">${tabs}</ul>
</div>
</div>
