# Prepares the environment for GitHub Copilot's coding agent, so it can run
# the Checks from README.md (flutter analyze && flutter test) before it opens
# a pull request. GitHub runs only the job named copilot-setup-steps.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # The tests' expected times are written for Jakarta (WIB).
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - run: flutter pub get
