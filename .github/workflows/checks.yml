# Runs the Checks from README.md (plus the format check from AGENTS.md) on
# every push to master and every pull request. The landing page isn't built
# here: Cloudflare's own build runs site/build.py and never deploys a failed
# one. The vendored liquid_glass_easy keeps its upstream formatting, so only
# our own folders are format-checked.
name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      release_pipeline:
        description: The caller is the release workflow, so always run checks.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      RELEASE_PIPELINE: ${{ inputs.release_pipeline || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: gate
        run: bash scripts/ci_release_gate.sh

  flutter:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The tests' expected times are written for Jakarta (WIB), as on the
    # developer's machine.
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Run the checks
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test
          python3 scripts/store_release_notes.py --check
