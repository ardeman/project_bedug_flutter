name: bedug
description: Jadwal Sholat & Kalender Hijriyah — Pengingat Sholat Khas Nusantara
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  adhan: ^2.0.0+1
  hijri: ^3.0.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.2.1
  timezone: ^0.11.2
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  cupertino_native: ^0.1.1
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

# App identifiers:
#   Android: com.bedug.app
#   iOS/macOS: com.bedug.app
#   Windows: com.bedug.app

# App icons. Sources are the SVGs in assets/branding/; after editing them run:
#   swift scripts/render_brand_icons.swift && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/branding/icon_macos.png
  windows:
    generate: true
    icon_size: 256
