# Builds release-mode apps for Android, macOS, Linux and Windows, then uploads
# downloadable artifacts. Android is debug-signed and macOS is not codesigned;
# neither artifact is ready for store distribution.
name: Builds

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'linux/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'windows/**'
      - 'pubspec.lock'
      - 'vendor/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'linux/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'windows/**'
      - 'pubspec.lock'
      - 'vendor/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # 3.47.9 includes the Dart AOT fix for Flutter issue #191575.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO flutter build macos --release
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/bedug.app \
            build/bedug-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-unsigned
          path: build/bedug-macos.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux build tools
        # GStreamer is for audioplayers (the selection tick and sound
        # previews). The runner's LLVM brings libunwind-14-dev, which blocks
        # libunwind-dev, a dependency of GStreamer's headers.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build linux --release
          tar -czf build/bedug-linux.tar.gz \
            -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/bedug-linux.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Build
        shell: pwsh
        run: |
          # Stop at the first failing command, flutter's included.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          flutter pub get
          flutter build windows --release
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/bedug-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/bedug-windows.zip
          if-no-files-found: error
