name: bedug
description: Jadwal Salat & Kalender Hijriyah — Pengingat Salat Khas Nusantara
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  adhan: ^2.0.0+1
  hijri: ^3.0.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.2.1
  timezone: ^0.11.2
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  flutter_compass: ^0.8.1
  dbus: ^0.7.15
  liquid_glass_easy: ^5.0.0
  audioplayers: ^6.8.1
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  # Apple builds use CocoaPods only (no mixed SPM/CocoaPods setup). This was
  # for cupertino_native, since removed; re-enabling SPM is a separate change.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/plus_jakarta_sans/OFL.txt
    # Selection tick for devices without a haptic engine.
    - assets/sounds/selection_tick.wav
    # Release notes, shared with the website (site/build.py).
    - assets/changelog/changelog.json
  # Brand typeface, bundled so the app stays offline first (SIL OFL 1.1,
  # license in assets/fonts/plus_jakarta_sans/OFL.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App identifiers:
#   Android, Linux: com.ardeman.bedug
#   iOS/macOS: com.ardeman.bedug
#   Windows: com.ardeman.bedug

# App icons for Android and Windows. Sources are the SVGs in assets/branding/;
# after editing them run:
#   swift scripts/render_brand_icons.swift && dart run flutter_launcher_icons
# iOS and macOS use the Icon Composer icon assets/branding/AppIcon.icon instead.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: false
  macos:
    generate: false
  windows:
    generate: true
    icon_size: 256
